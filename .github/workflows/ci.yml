# CLI CI: Go checks in workspace mode against the submodules, workflow lint and the ci gate.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: go checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    # Keep in sync with CodeClarityCE/.github go-library.yml, the Dockerfiles and go.mod.
    container:
      image: golang:1.27.3@sha256:2920bb124f1a2e12a1d39f0cab756ae0068441ee1da7655dec7f5e374944095b
    env:
      GOTOOLCHAIN: local
      GOPRIVATE: github.com/CodeClarityCE/*
    defaults:
      run:
        shell: bash
    steps:
      # go.work lists the submodules, so workspace mode needs them checked out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      # The container runs as root, so git needs the runner-owned checkout marked safe.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: go mod download
        run: go mod download
      - name: go mod tidy
        run: |
          go mod tidy -diff || {
            echo "::error file=go.mod::go.mod or go.sum is not tidy. Run go mod tidy and commit the result."
            exit 1
          }
      - name: gofmt
        # Only the CLI's own files; the submodules are checked in their own repos.
        run: |
          files=$(gofmt -l main.go cmd internal)
          if [[ -n "$files" ]]; then
            while IFS= read -r f; do
              echo "::error file=$f::$f is not gofmt-formatted"
            done <<<"$files"
            echo "Run gofmt -w on the files above"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -v ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: go build
        run: go build -o bin/codeclarity .

  lint:
    name: workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor:1.32.0@sha256:3014cc8f68f663935f69b3c3e0e41f5ce102b268d97db13db0f62208747f860d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          # actionlint 1.7.12 predates the $/ self-repository syntax, so skip that one error.
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo "$ACTIONLINT_IMAGE" \
            -ignore 'reusable workflow call "\$/' \
            -format '{{range $err := .}}::error file={{$err.Filepath}},line={{$err.Line}},col={{$err.Column}}::{{$err.Message}}%0A```%0A{{replace $err.Snippet "\\n" "%0A"}}%0A```\n{{end}}'
      - name: zizmor
        # Runs even when actionlint fails, so both report.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Our own CodeClarityCE refs may use tags like v1; everything else needs a SHA.
          cat >"$RUNNER_TEMP/zizmor.yml" <<'EOF'
          rules:
            unpinned-uses:
              config:
                policies:
                  "CodeClarityCE/*": ref-pin
                  "*": hash-pin
            dependabot-cooldown:
              config:
                days: 3
          EOF
          docker run --rm -e GH_TOKEN -v "$GITHUB_WORKSPACE:/repo:ro" -v "$RUNNER_TEMP/zizmor.yml:/zizmor.yml:ro" \
            -w /repo "$ZIZMOR_IMAGE" --config /zizmor.yml --format github .

  # The required check: fails if any job failed or was cancelled; skipped jobs count as success.
  ci:
    needs: [checks, lint]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key): \(.value.result)"' <<<"$NEEDS")
          if [[ -n "$bad" ]]; then
            echo "::error::Jobs did not succeed: $(tr '\n' ' ' <<<"$bad")"
            exit 1
          fi
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
