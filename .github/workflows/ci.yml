# CLI CI: the central Go checks in workspace mode, workflow lint and the ci gate.
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Workspace mode against the submodules; golangci-lint alone runs with GOWORK=off,
  # since the CLI imports no workspace module.
  checks:
    uses: CodeClarityCE/.github/.github/workflows/go-checks.yml@v1
    permissions:
      contents: read
    with:
      submodules: recursive
      golangci-lint-gowork-off: true

  lint:
    uses: CodeClarityCE/.github/.github/workflows/workflow-lint.yml@v1
    permissions:
      contents: read

  # The required check: fails if any needed job failed or was cancelled; skipped counts as success.
  # CodeQL on every PR and push; outside ci's needs, so findings never fail ci.
  codeql:
    uses: CodeClarityCE/.github/.github/workflows/codeql.yml@v1
    permissions:
      contents: read
      security-events: write
    with:
      go-directory: .

  ci:
    needs: [checks, lint]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          if [[ " $RESULTS " == *" failure "* || " $RESULTS " == *" cancelled "* ]]; then
            echo "::error::A needed job failed or was cancelled: $RESULTS"
            exit 1
          fi

  # Tracks a failing ci on pushes to main and develop in one issue per branch; not the required check.
  report:
    needs: [ci]
    if: ${{ !cancelled() && github.event_name == 'push' && (needs.ci.result == 'success' || needs.ci.result == 'failure') }}
    uses: CodeClarityCE/.github/.github/workflows/ci-report.yml@v1
    permissions:
      issues: write
      actions: read
    with:
      ci-result: ${{ needs.ci.result }}
